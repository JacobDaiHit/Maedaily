name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standard-library:
    name: Standard library (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Public source, clean archive, regression tests, and standard-library lessons
        run: python -X utf8 scripts/check_repository.py --tracked-only --clean-copy --archive-ref HEAD --tests --smoke stdlib --json study_runs/ci_standard_library.json
      - name: Independently verify published A and B/C evidence
        run: |
          python -X utf8 references/evidence/project_a_20261002/verify.py --source-root .
          python -X utf8 scripts/verify_reference_run.py --verify-package references/evidence/project_bc_20261002
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standard-library-${{ matrix.os }}-py${{ matrix.python }}
          path: study_runs/ci_standard_library.json
          if-no-files-found: warn

  pytorch-cpu:
    name: PyTorch CPU lessons and training evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch in the CI environment
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Regression tests and all registered default lessons
        run: python -X utf8 scripts/check_repository.py --tracked-only --tests --smoke all --json study_runs/ci_pytorch_cpu.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytorch-cpu-checks
          path: study_runs/ci_pytorch_cpu.json
          if-no-files-found: warn
